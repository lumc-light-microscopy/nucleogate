# Canonical pinned environment for omero_nuclei_flow.py (StarDist backend).
#
# Python is pinned to 3.10 and TensorFlow to 2.10.1 because TensorFlow 2.10 is
# the LAST release with native-Windows GPU support, and TF 2.10 supports Python
# 3.7-3.10 only. Everything else below is pinned to what TF 2.10 actually
# tolerates:
#   numpy    <1.24   (TF <2.11 breaks on numpy 1.24+; 2.x breaks StarDist too)
#   protobuf <3.20   (TF <2.11 is binary-incompatible with protobuf 3.20+)
#
# Windows GPU users additionally need CUDA 11.2 + cuDNN 8.1 (included below).
# On Linux this same stack works for CPU and GPU. On macOS, or if you would
# rather not be frozen on Python 3.10, use environment-cellpose.yml instead.
#
#   conda env create -f environment.yml
#   conda activate omeroflow
#   python omero_nuclei_flow.py --check-env

name: omeroflow

channels:
  - conda-forge
  - nodefaults

dependencies:
  - python=3.10

  # --- CRITICAL PIN ----------------------------------------------------------
  # setuptools 82 (Feb 2026) REMOVED pkg_resources. StarDist 0.8.5 still does
  # `from pkg_resources import get_distribution` in bioimageio_utils.py, so a
  # current setuptools breaks `import stardist` with
  #   ModuleNotFoundError: No module named 'pkg_resources'
  # Pinned below the deprecation (81) rather than the removal (82) to avoid the
  # warning spam as well.
  - setuptools<81

  # --- OMERO client (zeroc-ice is the awkward one; conda-forge has binaries) --
  - zeroc-ice=3.6.5
  - omero-py>=5.17

  # --- scientific stack, pinned to what TensorFlow 2.10 accepts --------------
  - numpy=1.23.5
  - pandas=2.0.3
  - scipy=1.10.1
  - scikit-image=0.21.0
  - matplotlib-base=3.7.3
  - scikit-learn=1.3.2

  # --- table formats ---------------------------------------------------------
  - pyarrow=12.0.1          # --per-nucleus-format parquet
  - openpyxl=3.1.2          # --per-nucleus-format xlsx

  # --- CUDA runtime for TensorFlow 2.10 (harmless on CPU-only machines) ------
  # TF 2.10 is built against CUDA 11.2 / cuDNN 8.1. Newer CUDA will NOT work.
  - cudatoolkit=11.2
  - cudnn=8.1.0

  - pip
  - pip:
      # TensorFlow must come from pip: conda-forge builds have historically
      # pulled an incompatible protobuf. '<2.11' is the Windows-GPU ceiling.
      - tensorflow==2.10.1
      - protobuf==3.19.6
      - h5py==3.7.0
      - stardist==0.8.5
      - csbdeep==0.7.4
