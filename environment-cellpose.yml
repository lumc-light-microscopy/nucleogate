# Alternative environment using Cellpose (PyTorch) instead of StarDist
# (TensorFlow), for omero_nuclei_flow.py --model cellpose
#
# Why you might prefer this on Windows: PyTorch still ships native-Windows GPU
# builds, so you are not frozen on TensorFlow 2.10 / Python 3.10 / CUDA 11.2.
# Nothing here is pinned to an end-of-life version, and numpy 2 is avoided only
# because Cellpose's own stack is happier below it.
#
#   conda env create -f environment-cellpose.yml
#   conda activate omeroflow-cp
#   python omero_nuclei_flow.py --check-env
#   python omero_nuclei_flow.py --model cellpose ...
#
# GPU: the line below installs the CPU build. For an NVIDIA GPU, replace
# `cpuonly` with `pytorch-cuda=12.1` and add the `nvidia` channel, or follow
# the current selector at https://pytorch.org/get-started/locally/

name: omeroflow-cp

channels:
  - conda-forge
  - pytorch
  - nodefaults

dependencies:
  - python=3.11
  - setuptools<81          # several deps still import pkg_resources (removed in 82)

  # --- OMERO client ----------------------------------------------------------
  - zeroc-ice=3.6.5
  - omero-py>=5.17

  # --- scientific stack ------------------------------------------------------
  - numpy>=1.24,<2
  - pandas>=2.0
  - scipy>=1.10
  - scikit-image>=0.22
  - matplotlib-base>=3.8
  - scikit-learn>=1.3
  - pyarrow>=14
  - openpyxl>=3.1

  # --- segmentation backend --------------------------------------------------
  - pytorch>=2.1
  - cpuonly                 # <-- swap for pytorch-cuda=12.1 (+ nvidia channel)

  - pip
  - pip:
      - cellpose>=3.0
